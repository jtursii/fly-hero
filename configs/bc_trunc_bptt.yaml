# bc_trunc_bptt (D40): a fork of bc_full_real_v2's checkpoint_best.pt
# (step 42000) via --init-from (fresh optimizer, fresh run dir). Identical to
# configs/bc_full_real_v2.yaml (sampler, curriculum, seed, batch, schedule)
# except the D40 block below and lr_brain (restored 2.5e-5 -> 5e-5).

processed_dir: "data/processed"

# D26 (docs/bench_train_memory.md): highest samples/sec config <=40GiB peak
# under the real training-loop shape. batch=8+checkpoint (3.77 samples/s)
# and batch=16+checkpoint (4.04 samples/s) are both measured, in-budget
# fallbacks if batch=4's smaller effective batch causes gradient-noise
# problems (loss not decreasing, unstable curriculum advancement).
batch_size: 4
gradient_checkpointing: false

burn_in_s: 1.0
train_window_s: 2.0

lr_readout: 1.0e-3
# D40: restored to 5e-5 (v2 had decayed to 1.25e-5 via D36 + two rollback
# halvings). --init-from builds a fresh optimizer, so this value is used.
lr_brain: 5.0e-5
# D36: cosine decay of both LRs from 1x at start_step to final_frac at
# start_step + duration_steps (flat afterwards).
lr_schedule:
  start_step: 42000
  duration_steps: 20000
  final_frac: 0.25
grad_clip_norm: 1.0

# D30 (docs/DECISIONS.md): offline diagnosis (scripts/diagnose_grad_explosion.py)
# found the known-unstable photoreceptor<->lamina pathway (R7, R8, L1, L5,
# one 2-neuron type; D28) passes through a finite-but-astronomically-large
# (1e5-1e14+) gradient regime before literally overflowing to inf --
# torch.nan_to_num alone doesn't catch that, and a single such entry
# dominated clip_grad_norm_'s combined norm, crushing every other
# parameter's real gradient to near zero on that step. Any |grad| entry
# above this bound is clamped (in addition to non-finite zeroing) before
# clipping. Chosen comfortably above any sane per-element gradient observed
# on healthy real clips (~O(1-600)) and far below the pathological range.
grad_outlier_clip: 10000.0

# D35 watchdog, baseline re-measured for this config (D40): truncated BPTT
# removes the exploding long-horizon terms, so v2's 339.4 does not apply.
# 5.7 = median logged brain grad_norm over the smoke test's steps
# 42100-42560 (runs/20260917_202213_bc_trunc_bptt_smoke; p90 9.2, max 20.1).
watchdog:
  baseline_grad_norm: 5.7
  rollback_median_ratio: 3.0
  rollback_consecutive_steps: 200
  healthy_ratio: 2.0
  healthy_window: 1000
  eval_ma_window: 3
  rollback_eval_drop: 0.08

# Note-aware clip sampling (user decision): 90% of clips have >=2 notes in
# the 2s gradient window, 10% have 0 (blank-highway "don't strum" clips).
# Burn-in may contain anything -- only the gradient window is classified.
frac_clips_with_notes: 0.9
min_notes_with: 2

# Strum pos_weight is NOT fixed here -- it's computed once per run from the
# actual positive-frame rate under this sampler (flyhero/game/clip_sampler)
# and logged (D27-style: reported in the run's metrics/PROGRESS, not a
# config constant), since a fixed guess would drift from whatever the real
# curriculum-difficulty mix produces.

curriculum:
  difficulties: ["Easy", "Medium", "Hard", "Expert"]
  advance_hit_rate: 0.75  # D36: compared against the 3-eval moving average (watchdog.eval_ma_window)
  earlier_frac: 0.2  # split evenly across all earlier (already-passed) difficulties

checkpoint_interval_steps: 500
checkpoint_interval_s: 900  # 15 min, whichever comes first; also on SIGTERM

eval:
  interval_steps: 1000
  n_val_songs: 10
  excerpt_s: 60.0  # fixed note-dense 60s excerpt per val song, same every eval

seed: 0

# D40: truncated BPTT -- detach the carried brain state every 30 frames
# (60 substeps) of the 120-frame gradient window.
tbptt_frames: 30
# D40: fret label onset at max(midpoint, time_s - hit_window_s) instead of
# the midpoint (flyhero/game/labels.py). Strum labels are unchanged.
fret_label_onset: "hit_window"

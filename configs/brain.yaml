processed_dir: "data/processed"

# Euler integration, 2 substeps per 60Hz game frame (PLAN Phase 3 task 1).
dt: 0.008333333  # 1/120
substeps_per_frame: 2

tau_init_s: 0.05
tau_min_s: 0.02

# D25: a small positive tonic baseline, not 0 (PLAN.md's original default).
# With b=0 and D12's photoreceptor-output-sign=-1, no non-photoreceptor
# neuron could ever reach r>0 at any gain0 (proven, see
# docs/gain0_stability.md) -- there was no tonic activity for inhibition to
# modulate via disinhibition. An initial guess of 0.2 fixed that but was
# itself too high relative to active_r_threshold=0.01 -- a uniform bias
# well above the "active" threshold makes almost the entire population read
# as trivially "active" at rest, regardless of gain0, saturating the sweep's
# active_frac check even though real signal reach existed underneath it.
# 0.005 (just below the threshold) keeps the resting population's active
# fraction low while still letting disinhibition-driven excursions cross it
# -- chosen from re-running scripts/gain0_sweep.py over bias_init in
# {0.005, 0.02, 0.05, 0.1}, not independently derived.
bias_init: 0.005

# D16: fine (one g per realized (pre_type,post_type) pair) / coarse (one g
# per (pre_type,post_super_class)) / hybrid (default: fine if a pair has
# >=k edges, else falls back to its coarse bucket). k=2 is the largest
# threshold with fine-pair edge coverage >=90% on the real graph (measured
# 93.85%, see docs/graph_report.md / graph_meta.json's hybrid_gain_sharing).
gain_sharing: "hybrid"
gain_sharing_k: 2

# Chosen by scripts/gain0_sweep.py (docs/gain0_stability.md): with
# bias_init=0.005, both gain0=10.0 and gain0=30.0 clear the stability sweep
# (active_frac in [0.01,0.30], DN reach_frac>0.10, no NaN). 10.0 is the more
# conservative choice (smaller max|v| for the same low-in-degree outlier
# neurons that scale ~linearly with gain0); 30.0 gives a larger reach_frac
# margin (0.468 vs 0.303) if that's preferred once training starts.
gain0: 10.0

readout:
  n_actions: 6  # 5 frets + strum

stability_sweep:
  # Log-spaced candidates spanning clearly-too-quiet to clearly-saturated,
  # so the sweep can locate whatever regime keeps 1-30% of neurons active.
  gain0_values: [0.1, 0.3, 1.0, 3.0, 10.0, 30.0]
  song_duration_s: 10.0
  active_r_threshold: 0.01       # r > this counts as "active"
  active_frac_min: 0.01
  active_frac_max: 0.30
  reach_threshold: 0.01          # |r_real - r_blank| above this counts as "reached"
  reach_frac_min: 0.10           # hard-stop bar (invariant 7): DN reach must clear this

bench:
  devices: ["cpu", "mps"]
  dtypes: ["float32", "float16"]
  batches: [1, 8, 32]
  min_syn_values: [5, 10]
  game_seconds: 1.0
  full_pipeline_batch: 8
